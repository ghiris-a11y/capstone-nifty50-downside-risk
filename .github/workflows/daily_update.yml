name: Daily data update

# 13:30 UTC = 7:00 PM IST, Monday to Friday (GitHub cron runs in UTC and can start a few minutes late)
on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Update live prices and latest risk
        id: update
        continue-on-error: true   # still commit the logs, then fail the run below
        run: python src/update_data.py

      - name: Commit data/live, data/logs and outputs/live if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/logs/update_log.csv outputs/live
          if [ -f data/logs/download_failures.csv ]; then git add data/logs/download_failures.csv; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Fail the run if any ticker failed validation
        if: steps.update.outcome == 'failure'
        run: |
          echo "update_data.py reported failures; see data/logs/update_log.csv"
          exit 1
